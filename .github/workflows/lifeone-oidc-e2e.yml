name: Life Lingo real LifeOne OIDC E2E
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/lifeone-oidc-e2e.yml'
  push:
    branches:
      - feat/01m-al-lifelingo-lifeone-oidc
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/lifeone-oidc-e2e.yml'
permissions:
  contents: read
concurrency:
  group: life-lingo-oidc-e2e-${{ github.sha }}
  cancel-in-progress: false
jobs:
  oidc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifelingotest
          POSTGRES_PASSWORD: lifelingotest
          POSTGRES_DB: keycloak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifelingotest -d keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VITE_LIFEONE_URL: http://127.0.0.1:18080
      VITE_LIFEONE_REALM: life-lingo-e2e
      VITE_LIFEONE_CLIENT_ID: life-lingo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated Keycloak
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "life-lingo-keycloak-$GITHUB_RUN_ID" --add-host host.docker.internal:host-gateway -p 127.0.0.1:18080:8080 \
            -e KC_DB=postgres -e KC_DB_URL=jdbc:postgresql://host.docker.internal:5432/keycloak \
            -e KC_DB_USERNAME=lifelingotest -e KC_DB_PASSWORD=lifelingotest \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 24)" \
            -v "$GITHUB_WORKSPACE/tests/fixtures/life-lingo-e2e-realm.json:/opt/keycloak/data/import/life-lingo-e2e-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.0 start-dev --http-enabled=true --hostname=http://127.0.0.1:18080 --import-realm > "$RUNNER_TEMP/life-lingo-keycloak.log" 2>&1
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/realms/life-lingo-e2e/.well-known/openid-configuration >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then docker logs --tail 80 "life-lingo-keycloak-$GITHUB_RUN_ID" 2>&1 | sed -E 's/(password|token|secret)[=:][^ ]+/\1=[REDACTED]/Ig'; exit 1; fi
      - name: Build existing learning platform
        run: npm run build
      - name: Start Vite preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/life-lingo-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/life-lingo-preview.pid"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
      - name: Run real browser self-registration and LifeOne login
        shell: bash
        run: |
          set -euo pipefail
          export E2E_USERNAME="life-lingo-$GITHUB_RUN_ID"
          export E2E_PASSWORD="$(openssl rand -hex 24)"
          export E2E_EMAIL="life-lingo-$GITHUB_RUN_ID@example.invalid"
          echo "::add-mask::$E2E_PASSWORD"
          RUN_LIFEONE_E2E=1 npm run test:lifeone-e2e
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f "life-lingo-keycloak-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/life-lingo-preview.pid" ]; then kill "$(cat "$RUNNER_TEMP/life-lingo-preview.pid")" >/dev/null 2>&1 || true; fi

name: Chinese Learning Hub CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build

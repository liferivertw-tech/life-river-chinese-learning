name: Chinese Learning Hub Visual QA

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: 16-language desktop/mobile visual QA
        run: npm run verify:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-11-16-language-visual-qa
          path: artifacts/build-11-homepage-qa/
          if-no-files-found: warn
          retention-days: 14
